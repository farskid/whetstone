<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Whetstone — library-style coding practice</title>
    <script>
      // Set the theme before first paint (no flash). Mirrors src/theme.ts: "system" follows the OS, anything else is dark.
      try {
        var s = JSON.parse(localStorage.getItem('practical:v2') || localStorage.getItem('practical:v1') || '{}') || {};
        var t = s.theme === 'system' ? (window.matchMedia && !matchMedia('(prefers-color-scheme: dark)').matches ? 'light' : 'dark') : s.theme === 'light' ? 'light' : 'dark';
        document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
    <!-- GoatCounter, cookieless analytics. Page views and events are sent from src/analytics.ts (hash routes). -->
    <script id="gc-script" data-goatcounter="https://trywhetstonedev.goatcounter.com/count"
            data-goatcounter-settings='{"no_onload": true, "no_events": true}'
            async src="//gc.zgo.at/count.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
